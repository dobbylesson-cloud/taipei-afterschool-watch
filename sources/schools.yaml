# 臺北市國小課後社團公告監測 — 來源設定
#
# type: nss   = 臺北市「校園網站系統 NSS」平台（多數國小採用），只需給 base_url，
#              程式會自動從首頁挖出公告模組的 mid/sid 再打 JSON API。
# type: ccms  = 臺北市政府 CCMS 平台（教育局、少數學校），以 HTML 列表頁解析。
#
# 選填欄位：
#   page_keys    覆寫「要抓哪些公告模組」的名稱關鍵字（預設見 settings.page_keys）
#   keywords     覆寫該來源的公告主題關鍵字（預設用 settings.keywords）
#   max_items    該來源單次最多處理幾筆公告
#   disabled     true 表示暫時停用
#   note         失敗/停用原因註記，會顯示在網頁與執行報告

settings:
  timeout: 25
  retries: 3
  # 每次請求間隔（秒），會在此區間內隨機取値，禮貌爬取
  interval_min: 1.0
  interval_max: 2.0
  max_pages: 2            # 每個來源最多翻幾頁列表
  max_items: 40           # 每個來源最多處理幾筆公告
  lookback_days: 400      # 只處理近 N 天內發布的公告（避免抓到多年前的舊公告）
  max_attachment_mb: 25
  max_attachments_per_notice: 3
  user_agent: "TaipeiAfterSchoolBot/1.0 (+monitoring school club announcements; contact: local-user)"
  respect_robots: true
  # 公告主題關鍵字：標題或內文命中即視為課後社團相關
  keywords:
    - 課後照顧
    - 課後班
    - 課後
    - 社團
    - 才藝
    - 育樂營
    - 冬令營
    - 夏令營
    - 安親
  # 標題命中這些詞就排除（多為政令宣導／採購／裁罰類公文，不是社團報名）
  exclude_keywords:
    - 補習班
    - 裁罰
    - 通報
    - 招標
    - 採購
  # 要抓的公告模組名稱（NSS）
  page_keys:
    - 最新消息
    - 公告
    - 消息
    - 快訊
    - 課後
    - 社團
    - 行政

sources:
  # ---------- 教育局 ----------
  - id: doe_taipei
    name: 臺北市政府教育局
    type: ccms
    list_url: https://www.doe.gov.taipei/News.aspx?n=9AA0CC873BD001A2&sms=2E90303507CA4A6B
    max_pages: 3
    note: 教育局「一般公告」頻道，僅抓取含課後照顧/社團關鍵字者

